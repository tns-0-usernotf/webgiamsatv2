<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Giám Sát Cảnh Báo Thiên Tai - MQTT Realtime</title>
    
    <!-- Thư viện vẽ biểu đồ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Thư viện Paho MQTT cho Web Browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            color: #333;
        }
        
        h1 { color: #1a237e; margin-bottom: 5px; }
        
        /* Trạng thái kết nối */
        #connection-status { 
            font-size: 14px; 
            padding: 8px 20px; 
            border-radius: 20px; 
            background: #e0e0e0; 
            display: inline-block; 
            margin-bottom: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        .connected { background: #c8e6c9 !important; color: #2e7d32; }
        .disconnected { background: #ffcdd2 !important; color: #c62828; }
        .connecting { background: #fff9c4 !important; color: #f57f17; }

        /* Hộp thoại gỡ lỗi trên màn hình */
        #debug-log {
            font-family: monospace;
            font-size: 12px;
            color: #666;
            margin: 0 auto 20px auto;
            max-width: 600px;
            height: 40px;
            overflow: hidden;
        }

        /* Thông điệp Cảnh báo chính */
        #status-text {
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            margin: 0 auto 20px auto;
            max-width: 600px;
            border-radius: 8px;
            transition: 0.3s;
        }

        /* Khu vực Thẻ trạng thái */
        .dashboard { 
            display: flex; 
            justify-content: center; 
            flex-wrap: wrap; 
            gap: 20px; 
            margin-top: 10px; 
        }
        .card { 
            background: white; 
            padding: 15px 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            width: 160px; 
            transition: transform 0.2s, background-color 0.3s;
        }
        .card h3 { margin: 0; font-size: 14px; color: #666; text-transform: uppercase; }
        .card h2 { margin: 10px 0 0 0; font-size: 28px; color: #2c3e50; }
        
        /* Hiệu ứng chớp đỏ khi nguy hiểm */
        .danger { 
            background-color: #ffebee !important; 
            color: #c62828 !important; 
            border: 2px solid #ef5350; 
            animation: pulse-red 1s infinite alternate; 
        }
        .warning {
            background-color: #fff3e0 !important;
            border: 2px solid #ff9800;
        }
        
        @keyframes pulse-red { 
            0% { box-shadow: 0 0 0 0 rgba(239, 83, 80, 0.7); } 
            100% { box-shadow: 0 0 15px 5px rgba(239, 83, 80, 0); } 
        }
        
        /* Khu vực Biểu đồ */
        .charts-row { 
            display: flex; 
            justify-content: center; 
            flex-wrap: wrap; 
            gap: 20px; 
            width: 95%; 
            max-width: 1400px; 
            margin: 25px auto; 
        }
        .chart-container { 
            flex: 1 1 30%; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            min-width: 300px; 
            height: 280px; 
        }
        .chart-container-large { flex: 1 1 45%; height: 320px; } 
    </style>
</head>
<body>

    <h1>TRUNG TÂM GIÁM SÁT THIÊN TAI</h1>
    <div id="connection-status" class="disconnected">Khởi động kết nối...</div>
    <div id="debug-log">Log: Đang chuẩn bị...</div>
    <div id="status-text">Đang chờ dữ liệu từ thiết bị...</div>

    <!-- 5 Thẻ Số liệu -->
    <div class="dashboard">
        <div class="card" id="card-soil"><h3>Độ ẩm đất</h3><h2 id="val-soil">-- %</h2></div>
        <div class="card" id="card-vib"><h3>Rung chấn</h3><h2 id="val-vib">-- m/s²</h2></div>
        <div class="card" id="card-x"><h3>Trục X (Pitch)</h3><h2 id="val-x">-- °</h2></div>
        <div class="card" id="card-y"><h3>Trục Y (Roll)</h3><h2 id="val-y">-- °</h2></div>
        <div class="card" id="card-z"><h3>Trục Z (Yaw)</h3><h2 id="val-z">-- °</h2></div>
    </div>

    <!-- Hàng 1: Môi trường cốt lõi -->
    <div class="charts-row">
        <div class="chart-container chart-container-large"><canvas id="soilChart"></canvas></div>
        <div class="chart-container chart-container-large"><canvas id="vibChart"></canvas></div>
    </div>

    <!-- Hàng 2: Phân tích Không gian 3D -->
    <div class="charts-row">
        <div class="chart-container"><canvas id="xChart"></canvas></div>
        <div class="chart-container"><canvas id="yChart"></canvas></div>
        <div class="chart-container"><canvas id="zChart"></canvas></div>
    </div>

    <script>
        // ==========================================
        // 1. CẤU HÌNH MQTT (WebSockets CỰC KỲ QUAN TRỌNG)
        // ==========================================
        const MQTT_BROKER = "broker.hivemq.com";
        // CỔNG 8884: Dành cho kết nối Bảo mật (WSS/HTTPS) - Bắt buộc nếu up lên GitHub Pages
        const MQTT_PORT = 8884; 
        const MQTT_TOPIC = "thientai/giamsat/vuhuytuan_12345"; 
        
        // Hàm in log ra màn hình web để dễ gỡ lỗi
        function logDebug(msg) {
            const time = new Date().toLocaleTimeString();
            document.getElementById('debug-log').innerText = `[${time}] ${msg}`;
            console.log(msg);
        }

        // ==========================================
        // 2. KHỞI TẠO 5 BIỂU ĐỒ
        // ==========================================
        function createChart(ctxId, label, color) {
            return new Chart(document.getElementById(ctxId).getContext('2d'), {
                type: 'line',
                data: { 
                    labels: [], 
                    datasets: [{ 
                        label: label, 
                        borderColor: color, 
                        backgroundColor: color.replace('1)', '0.15)'), 
                        borderWidth: 2, pointRadius: 2, fill: true, data: [] 
                    }] 
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 0 }, 
                    scales: { x: { display: true } }
                }
            });
        }

        const soilChart = createChart('soilChart', 'Độ ẩm đất (%)', 'rgba(33, 150, 243, 1)'); 
        const vibChart  = createChart('vibChart', 'Rung chấn (m/s²)', 'rgba(244, 67, 54, 1)'); 
        const xChart    = createChart('xChart', 'Nghiêng Trục X (°)', 'rgba(255, 152, 0, 1)'); 
        const yChart    = createChart('yChart', 'Nghiêng Trục Y (°)', 'rgba(156, 39, 176, 1)'); 
        const zChart    = createChart('zChart', 'Xoay Trục Z (°/s)', 'rgba(76, 175, 80, 1)'); 

        // ==========================================
        // 3. LOGIC KẾT NỐI VÀ XỬ LÝ MQTT
        // ==========================================
        let mqttClient;

        function updateConnectionStatus(msg, state) {
            const div = document.getElementById('connection-status');
            div.innerText = msg;
            div.className = state; // 'connected', 'disconnected', 'connecting'
        }

        function startMqttConnection() {
            updateConnectionStatus("Đang kết nối đến HiveMQ...", "connecting");
            logDebug(`Khởi tạo Client kết nối tới ${MQTT_BROKER}:${MQTT_PORT} (WSS)`);
            
            const clientId = "WebClient_" + Math.random().toString(16).substr(2, 8);
            mqttClient = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, clientId);

            mqttClient.onConnectionLost = onConnectionLost;
            mqttClient.onMessageArrived = onMessageArrived;

            const connectOptions = {
                timeout: 5,
                useSSL: true, // BẮT BUỘC ĐỂ KHÔNG BỊ TRÌNH DUYỆT CHẶN (HTTPS)
                onSuccess: onConnect,
                onFailure: function (message) {
                    logDebug("Lỗi kết nối: " + message.errorMessage);
                    updateConnectionStatus("Lỗi kết nối. Thử lại sau 3s...", "disconnected");
                    setTimeout(startMqttConnection, 3000);
                }
            };

            mqttClient.connect(connectOptions);
        }

        function onConnect() {
            updateConnectionStatus("MQTT: Đang hoạt động (Real-time)", "connected");
            logDebug(`Kết nối thành công! Đang Subscribe: ${MQTT_TOPIC}`);
            mqttClient.subscribe(MQTT_TOPIC); 
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                logDebug("Rớt mạng: " + responseObject.errorMessage);
                updateConnectionStatus("Mất kết nối. Đang thử kết nối lại...", "disconnected");
                setTimeout(startMqttConnection, 3000);
            }
        }

        // ==========================================
        // 4. XỬ LÝ DỮ LIỆU TỪ ESP32
        // ==========================================
        function onMessageArrived(message) {
            try {
                const data = JSON.parse(message.payloadString);
                const time = new Date().toLocaleTimeString();
                logDebug(`Đã nhận dữ liệu mới lúc ${time}`);

                // Cập nhật số lên Thẻ
                document.getElementById('val-soil').innerText = data.soil + " %";
                document.getElementById('val-vib').innerText  = data.vib + " m/s²";
                document.getElementById('val-x').innerText    = data.angleX + " °";
                document.getElementById('val-y').innerText    = data.angleY + " °";
                document.getElementById('val-z').innerText    = data.angleZ + " °";

                // Xử lý Cảnh báo
                const maxTilt = Math.max(Math.abs(data.angleX), Math.abs(data.angleY));
                const statusText = document.getElementById('status-text');

                document.querySelectorAll('.card').forEach(c => { c.classList.remove('danger', 'warning'); });
                statusText.style.backgroundColor = "transparent";
                statusText.style.color = "#333";

                if (data.isEarthquake || data.vib > 2.0) { 
                    document.getElementById('card-vib').classList.add('danger');
                    statusText.innerText = "🚨 KHẨN CẤP: PHÁT HIỆN ĐỘNG ĐẤT 🚨";
                    statusText.style.backgroundColor = "#ffcdd2"; statusText.style.color = "#c62828";
                } 
                else if (data.isLandslide || data.soil > 80 || maxTilt > 30.0) { 
                    if(data.soil > 80) document.getElementById('card-soil').classList.add('danger');
                    if(Math.abs(data.angleX) > 30) document.getElementById('card-x').classList.add('danger');
                    if(Math.abs(data.angleY) > 30) document.getElementById('card-y').classList.add('danger');
                    
                    statusText.innerText = "⚠️ BÁO ĐỘNG: NGUY CƠ SẠT LỞ CAO ⚠️";
                    statusText.style.backgroundColor = "#ffe0b2"; statusText.style.color = "#e65100";
                } 
                else if (data.vib > 1.0 || data.soil > 60 || maxTilt > 20.0) {
                    if(data.vib > 1.0) document.getElementById('card-vib').classList.add('warning');
                    if(data.soil > 60) document.getElementById('card-soil').classList.add('warning');
                    statusText.innerText = "Chú ý: Có dấu hiệu bất thường";
                    statusText.style.color = "#ef6c00";
                } 
                else {
                    statusText.innerText = "✅ Hệ thống an toàn.";
                    statusText.style.color = "#2e7d32";
                }

                // Vẽ Biểu đồ
                const updateChartData = (chart, value) => {
                    chart.data.labels.push(time);
                    chart.data.datasets[0].data.push(value);
                    if (chart.data.labels.length > 30) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
                    chart.update();
                };

                updateChartData(soilChart, data.soil);
                updateChartData(vibChart, data.vib);
                updateChartData(xChart, data.angleX);
                updateChartData(yChart, data.angleY);
                updateChartData(zChart, data.angleZ);

            } catch (e) { logDebug("Lỗi đọc JSON: " + e.message); }
        }

        // Tự động chạy khi mở web
        window.onload = startMqttConnection;
    </script>
</body>
</html>
