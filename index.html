    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; text-align: center; margin: 0; padding: 20px; color: #333; }
        h1 { color: #1a237e; margin-bottom: 5px; }
        
        /* Bảng trạng thái tín hiệu */
        .status-bar { margin: 15px 0; }
        .badge { padding: 6px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 0 10px; display: inline-block; transition: 0.3s;}
        .bg-green { background: #c8e6c9; color: #2e7d32; }
        .bg-gray { background: #e0e0e0; color: #666; }
        .bg-red { background: #ffcdd2; color: #c62828; }
        
        #alert-box { font-size: 22px; font-weight: bold; padding: 15px; max-width: 600px; margin: 0 auto 20px; border-radius: 8px; transition: 0.3s; background-color: white; border: 1px solid #ccc;}

        .dashboard { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: 10px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 160px; }
        .card h3 { margin: 0; font-size: 13px; color: #666; text-transform: uppercase; }
        .card h2 { margin: 8px 0 0 0; font-size: 24px; color: #2c3e50; }
        .card p { margin: 5px 0 0 0; font-size: 11px; color: #999; }

        .danger { background-color: #ffebee !important; color: #c62828 !important; border: 2px solid #ef5350 !important; }
        .warning { background-color: #fff3e0 !important; border: 2px solid #ff9800 !important; }

        .section-title { margin-top: 40px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; color: #555; border-bottom: 2px solid #ccc; display: inline-block; padding-bottom: 5px;}
        
        .charts-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; width: 95%; max-width: 1400px; margin: 0 auto; }
        .chart-container { flex: 1 1 30%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); min-width: 300px; height: 260px; }
        .chart-large { flex: 1 1 45%; height: 300px; }
    </style>
</head>
<body>
