<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giám Sát Thiên Tai Chuyên Sâu</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; margin: 0; padding: 20px; }
        
        /* Khu vực Thẻ trạng thái */
        .dashboard { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 180px; }
        .danger { background-color: #ffebee; color: #c62828; border: 2px solid #c62828; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        
        /* Khu vực Biểu đồ - Chia làm 2 hàng */
        .charts-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; width: 95%; max-width: 1400px; margin: 20px auto; }
        .chart-container { flex: 1 1 30%; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); min-width: 300px; height: 250px; }
        .chart-container-large { flex: 1 1 45%; } /* Biểu đồ hàng trên to hơn */
    </style>
</head>
<body>

    <h1>HỆ THỐNG GIÁM SÁT SỤT LÚN & ĐỘNG ĐẤT</h1>
    <h2 id="status-text">Đang tải dữ liệu...</h2>

    <div class="dashboard">
        <div class="card" id="card-soil"><h3>Độ ẩm đất</h3><h2 id="val-soil">-- %</h2></div>
        <div class="card" id="card-vib"><h3>Rung chấn</h3><h2 id="val-vib">-- m/s²</h2></div>
        <div class="card" id="card-x"><h3>Trục X (Pitch)</h3><h2 id="val-x">-- °</h2></div>
        <div class="card" id="card-y"><h3>Trục Y (Roll)</h3><h2 id="val-y">-- °</h2></div>
        <div class="card" id="card-z"><h3>Trục Z (Yaw)</h3><h2 id="val-z">-- °</h2></div>
    </div>

    <!-- Hàng 1: Môi trường cốt lõi -->
    <div class="charts-row">
        <div class="chart-container chart-container-large"><canvas id="soilChart"></canvas></div>
        <div class="chart-container chart-container-large"><canvas id="vibChart"></canvas></div>
    </div>

    <!-- Hàng 2: Phân tích Không gian 3D -->
    <div class="charts-row">
        <div class="chart-container"><canvas id="xChart"></canvas></div>
        <div class="chart-container"><canvas id="yChart"></canvas></div>
        <div class="chart-container"><canvas id="zChart"></canvas></div>
    </div>

    <script>
        const CHANNEL_ID = "3349950"; 
        const READ_API_KEY = "J19ZUM4EVA7CGQLJ";
        
        // Hàm hỗ trợ tạo biểu đồ siêu tốc
        function createChart(ctxId, label, color) {
            return new Chart(document.getElementById(ctxId).getContext('2d'), {
                type: 'line',
                data: { labels: [], datasets: [{ label: label, borderColor: color, backgroundColor: color.replace('1)', '0.1)'), borderWidth: 2, fill: true, data: [] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // Khởi tạo 5 biểu đồ với 5 màu khác nhau
        const soilChart = createChart('soilChart', 'Độ ẩm đất (%)', 'rgba(33, 150, 243, 1)'); // Xanh dương
        const vibChart = createChart('vibChart', 'Rung chấn (m/s²)', 'rgba(244, 67, 54, 1)'); // Đỏ
        const xChart = createChart('xChart', 'Nghiêng Trục X (°)', 'rgba(255, 152, 0, 1)'); // Cam
        const yChart = createChart('yChart', 'Nghiêng Trục Y (°)', 'rgba(156, 39, 176, 1)'); // Tím
        const zChart = createChart('zChart', 'Xoay Trục Z (°/s)', 'rgba(76, 175, 80, 1)'); // Xanh lá

        async function fetchData() {
            const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_API_KEY}&results=1`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                const feed = data.feeds[0]; 

                const soil = parseFloat(feed.field1);
                const vib = parseFloat(feed.field2);
                const angleX = parseFloat(feed.field5);
                const angleY = parseFloat(feed.field6);
                const angleZ = parseFloat(feed.field7);
                const time = new Date(feed.created_at).toLocaleTimeString();

                // Cập nhật giá trị hiển thị thẻ
                document.getElementById('val-soil').innerText = soil + " %";
                document.getElementById('val-vib').innerText = vib + " m/s²";
                document.getElementById('val-x').innerText = angleX + " °";
                document.getElementById('val-y').innerText = angleY + " °";
                document.getElementById('val-z').innerText = angleZ + " °";

                // Logic Cảnh báo (Lấy góc X hoặc Y lớn nhất làm chuẩn)
                const maxTilt = Math.max(Math.abs(angleX), Math.abs(angleY));
                const statusText = document.getElementById('status-text');

                document.querySelectorAll('.card').forEach(c => c.classList.remove('danger'));
                statusText.style.color = "black";

                if (vib > 2.0) { 
                    document.getElementById('card-vib').classList.add('danger');
                    statusText.innerText = "!! CẢNH BÁO ĐỘNG ĐẤT !!";
                    statusText.style.color = "red";
                } else if (soil > 80 || maxTilt > 30.0) { 
                    if(soil > 80) document.getElementById('card-soil').classList.add('danger');
                    if(Math.abs(angleX) > 30) document.getElementById('card-x').classList.add('danger');
                    if(Math.abs(angleY) > 30) document.getElementById('card-y').classList.add('danger');
                    statusText.innerText = "!! NGUY CƠ SẠT LỞ !!";
                    statusText.style.color = "orange";
                } else {
                    statusText.innerText = "Hệ thống an toàn";
                }

                // Hàm nạp dữ liệu vào biểu đồ
                const updateChart = (chart, value) => {
                    chart.data.labels.push(time);
                    chart.data.datasets[0].data.push(value);
                    if (chart.data.labels.length > 15) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
                    chart.update();
                };

                updateChart(soilChart, soil);
                updateChart(vibChart, vib);
                updateChart(xChart, angleX);
                updateChart(yChart, angleY);
                updateChart(zChart, angleZ);

            } catch (error) { console.error("Lỗi:", error); }
        }

        setInterval(fetchData, 20000);
        fetchData(); 
    </script>
</body>
</html>
